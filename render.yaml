# Render Blueprint for the backend (Dashboard -> New -> Blueprint, pick this repo).
services:
  - type: web
    name: hyundai-assistant-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_BUCKET
        value: brochures
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-3.8-flash,gemini-3.7-flash,gemini-3.5-flash,gemini-3.1-flash-lite
      - key: LLM_QUERY_PLANNER
        value: "false"
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: "768"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  # Frontend (Next.js). Deployed on Render instead of Vercel; see docs/DECISIONS.md.
  - type: web
    name: hyundai-assistant-web
    runtime: node
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SHOW_DEMO_HINT
        value: "true"
