[project]
name = "hyundai-assistant-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "BLE"]
ignore = ["S101", "S105", "S106", "B008", "S311", "S324"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "BLE"]
"app/rag/prompts.py" = ["E501"]
"app/ingestion/metadata.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
